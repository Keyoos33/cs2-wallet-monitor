# Publie le dashboard statique (dossier site/) sur GitHub Pages.
# Les données vivantes (data.json, heartbeat.json, analysis.json) ne sont PAS publiées ici :
# la page les lit en direct sur la branche `data` (raw.githubusercontent.com), donc ce workflow
# ne tourne que lorsque le code du dashboard change.
name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
