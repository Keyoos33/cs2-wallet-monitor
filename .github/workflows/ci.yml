# Tests et typage à chaque modification du code (ne touche ni aux secrets ni à la branche `data`).
name: ci

on:
  push:
    branches: [main]
    paths-ignore: [".kick", "notes/**", "README.md"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
